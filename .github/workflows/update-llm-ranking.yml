name: Update LLMRANK Data
on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate data
        run: python3 scripts/generate_data.py

      - name: Commit if changed
        run: |
          git config user.name "atman-bot"
          git config user.email "bot@atman.dev"
          git add public/data/ scripts/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): auto-update $(date +%Y-%m-%d)"
            git push
          fi
